name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build and smoke test
        run: |
          cd ps2classic-ps2classic
          make
          make check
      - name: Package Linux download
        run: |
          mkdir -p dist
          tar -czf dist/ps2classics-linux-x86_64.tar.gz \
            README.md \
            GPLv3.txt \
            install-desktop.sh \
            ps2classic-ps2classic/ps2classic \
            ps2classic-ps2classic/ps2classic-gui \
            ps2classic-ps2classic/setup-pop-fe2.sh
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ps2classics-linux-x86_64
          path: dist/ps2classics-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-qemu
            mingw-w64-x86_64-toolchain
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build
        run: |
         mkdir bins
         cd ps2classic-ps2classic
         make
         cp *.exe bins/


      - name: Prepare artifact for packaging
        run: |
           cp /mingw64/bin/*.dll ps2classic-ps2classic/bins/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{github.workspace}}/ps2classic-ps2classic/bins
